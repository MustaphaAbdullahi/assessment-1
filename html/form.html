<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
  </head>
  <body>
    <nav aria-label="main-navigation">
      <a href="index.html">Home</a>
      <a href="form.html">Sign In</a>
    </nav>
    <header>
      <h1>Sign In</h1>
      <p>
        Enter your email address and password to securely login to Altschool
        student portal
      </p>
    </header>
    <main>
      <form action="" method="post">
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="john.doe.example.com"
          required
        />
        <br />
        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="********"
          required
        />
        <br />
        <button type="submit">Proceed to Dashboard</button>
      </form>
      <p>forgot your password? <a href="">Reset Now!</a></p>
      <p>OR</p>
      <p><a href="">Login with Google</a></p>
      <p>dont have an account? <a href="">Sign Up</a></p>
    </main>
    <footer>
      <p>&copy; 2021 Altschool Africa. All rights reserved.</p>
    </footer>
  </body>
</html>
